# Written by `tero init`. No process may write a core dump, which could leak
# secrets from memory. See docs/security/cis-subset.md for the CIS controls.
# "-" sets the soft and hard limits. pam_limits never applies "*" to root, and
# on Ubuntu 26.04 systemd ships 10-coredump-debian.conf, which lifts root's
# hard limit to infinity, so root gets its own line.
* - core 0
root - core 0
