# Written by `tero init`. Directories on tmpfs where the agent and
# tero-podman's Podman meet, created again at every boot.
#
# The Podman service's socket. Only tero-podman and its group, whose only
# other member is tero-agent, can enter it.
d /run/tero-podman 0750 tero-podman tero-podman -
# Each app container's variables. tero-agent writes them; tero-podman's
# Podman mounts each file into its container.
d /run/tero-env 0750 tero-agent tero-podman -
# Each app container's output. tero-podman's conmon writes it; tero-agent
# removes what a removed container left.
d /run/tero-output 2770 tero-podman tero-podman -
