# Publishes a release for every version tag, once the tests and a scan for
# known vulnerabilities pass. The build itself runs in the reusable workflow,
# isolated from this caller, which is what makes the provenance SLSA Build
# Level 3.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Test
        run: |
          (cd web && bun install --frozen-lockfile)
          make test

      # Both released architectures, since build tags change what is compiled.
      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=linux GOARCH=amd64 "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=linux GOARCH=arm64 "$(go env GOPATH)/bin/govulncheck" ./...
          cd web && bun audit

  release:
    needs: check
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release.yml
