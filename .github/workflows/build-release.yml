# Builds and publishes a release with GoReleaser, then signs SLSA provenance
# for every file in checksums.txt through Sigstore and attaches it to the
# release as tero.intoto.jsonl. Verify a downloaded binary
# with:
#
#   gh attestation verify tero-linux-amd64 --repo leanhanc/tero \
#     --signer-workflow leanhanc/tero/.github/workflows/build-release.yml
name: Build release

on:
  workflow_call:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No dependency caches: a release builds from a clean slate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install Syft
        run: go install github.com/anchore/syft/cmd/syft@v1.54.1

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: dist/checksums.txt

      # The attestation also goes on the release itself, where verifiers that
      # don't use GitHub's attestation API, such as OpenSSF Scorecard, look.
      - name: Attach provenance to the release
        run: |
          cp "$BUNDLE" tero.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" tero.intoto.jsonl --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
